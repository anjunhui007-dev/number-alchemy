<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sprite Studio</title><style>
*{box-sizing:border-box}body{margin:0;background:#17181e;color:#eee;font:14px system-ui}header,footer,aside,section{padding:14px;background:#24262e}header{display:flex;gap:10px;align-items:center;flex-wrap:wrap}h1{font-size:20px;margin:0 20px 0 0}button,input,select{background:#353844;color:#eee;border:1px solid #555968;border-radius:6px;padding:7px}button{cursor:pointer}button:hover{background:#50546a}main{display:grid;grid-template-columns:210px 1fr 260px;min-height:65vh;gap:2px}aside label{display:flex;justify-content:space-between;align-items:center;margin:9px 0}input[type=number]{width:85px}#stage{overflow:auto;display:grid;place-items:center;background:#111218;min-height:450px}canvas{image-rendering:pixelated;background:repeating-conic-gradient(#30323b 0% 25%,#23252d 0% 50%) 0/20px 20px;max-width:100%;touch-action:none}#frames{display:flex;gap:8px;overflow:auto;padding:12px 0}.tile{min-width:85px;display:grid;justify-items:center;gap:5px}.tile img{width:65px;height:65px;object-fit:contain;image-rendering:pixelated}.active{outline:2px solid #ad91ff}small{color:#aaa}hr{border:0;border-top:1px solid #444}#groups button{display:block;width:100%;margin:5px 0} @media(max-width:800px){main{grid-template-columns:1fr}#stage{min-height:300px}}
</style><header><h1>Sprite Studio</h1><button onclick="files.click()">이미지 추가</button><input hidden id="files" type="file" multiple accept="image/*"><button onclick="sheet.click()">시트 분리</button><input hidden id="sheet" type="file" accept="image/*"><button onclick="saveProject()">프로젝트 저장</button><button onclick="project.click()">프로젝트 열기</button><input hidden id="project" type="file" accept=".json"><button onclick="undo()">실행 취소</button><button onclick="redo()">다시 실행</button></header><main><aside><b>애니메이션 그룹</b><div id="groups"></div><button onclick="addGroup()">+ 그룹 추가</button><hr><small>이미지를 드래그하여 위치를 조정하세요. 방향키는 1px 이동, Shift는 10px 이동입니다.</small><hr><button onclick="alignAll()">전체 하단 중앙 정렬</button><button onclick="trim()">투명 여백 제거</button><hr><button onclick="removeBg()">배경색 제거</button><label>허용 오차<input id="tol" type="number" value="25" min="0" max="255"></label></aside><div id="stage"><canvas id="view" width="256" height="256"></canvas></div><aside><b>캔버스</b><label>너비<input id="w" type="number" min="1" max="4096" value="256"></label><label>높이<input id="h" type="number" min="1" max="4096" value="256"></label><label>확대 %<input id="zoom" type="number" value="150" min="10" max="800"></label><hr><b>선택 프레임</b><label>X<input id="x" type="number"></label><label>Y<input id="y" type="number"></label><label>크기 %<input id="scale" type="number" min="1" value="100"></label><label>회전<input id="rot" type="number" value="0"></label><label>재생 ms<input id="duration" type="number" min="1" placeholder="자동"></label><button onclick="flip()">좌우 반전</button><button onclick="applyAll()">크기 전체 적용</button><hr><label>어니언 스킨<input id="onion" type="checkbox" checked></label><label>기준 프레임<input id="ref" type="number" min="0" value="0"></label><label>겹침 투명도<input id="alpha" type="range" min="0" max="100" value="30"></label><label>가이드<input id="guide" type="checkbox" checked></label><hr><button onclick="exportPNG()">현재 PNG</button><button onclick="exportSheet()">시트 PNG</button><button onclick="exportZip()">전체 ZIP</button></aside></main><footer><button onclick="play()">▶ 재생 / 정지</button> FPS <input id="fps" type="number" value="8" min="1" max="60" style="width:65px"><select id="mode"><option value="forward">정방향</option><option value="reverse">역방향</option><option value="ping">왕복</option></select> <button onclick="move(-1)">← 순서</button><button onclick="move(1)">순서 →</button><button onclick="duplicate()">복제</button><button onclick="del()">삭제</button><div id="frames"></div></footer><script>
const $=id=>document.getElementById(id),ctx=$('view').getContext('2d');let state={w:256,h:256,g:[{name:'Idle',f:[]},{name:'Attack',f:[]},{name:'Hit',f:[]},{name:'Projectile',f:[]}],gi:0,i:0},past=[],future=[],cache=new Map(),timer=null,dir=1;
const group=()=>state.g[state.gi],frames=()=>group().f,cur=()=>frames()[state.i];function snap(){past.push(JSON.stringify(state));if(past.length>30)past.shift();future=[]}function persist(){try{localStorage.setItem('sprite-studio',JSON.stringify(state))}catch(e){}}function undo(){if(past.length){future.push(JSON.stringify(state));state=JSON.parse(past.pop());refresh()}}function redo(){if(future.length){past.push(JSON.stringify(state));state=JSON.parse(future.pop());refresh()}}
function img(src){if(!cache.has(src)){let i=new Image;i.onload=draw;i.src=src;cache.set(src,i)}return cache.get(src)}function canvas(w,h){let c=document.createElement('canvas');c.width=w;c.height=h;return c}function paint(c,f,a=1){if(!f)return;let im=img(f.src);if(!im.complete||!im.naturalWidth)return;c.save();c.globalAlpha=a;c.imageSmoothingEnabled=false;c.translate(f.x,f.y);c.rotate(f.rot*Math.PI/180);c.scale(f.scale/100*(f.flip?-1:1),f.scale/100);c.drawImage(im,-im.width/2,-im.height/2);c.restore()}
function draw(){let v=$('view');if(v.width!==state.w)v.width=state.w;if(v.height!==state.h)v.height=state.h;v.style.width=state.w*(+$('zoom').value||100)/100+'px';ctx.clearRect(0,0,v.width,v.height);if(!timer&&$('onion').checked){let n=+$('ref').value,a=+$('alpha').value/100;if(n>0)paint(ctx,frames()[n-1],a);else{paint(ctx,frames()[state.i-1],a);paint(ctx,frames()[state.i+1],a)}}paint(ctx,cur());if(!timer&&$('guide').checked){ctx.strokeStyle='#a99bd888';ctx.setLineDash([4,4]);ctx.beginPath();ctx.moveTo(state.w/2,0);ctx.lineTo(state.w/2,state.h);ctx.moveTo(0,state.h-1);ctx.lineTo(state.w,state.h-1);ctx.stroke();ctx.setLineDash([])}}
function refresh(){state.i=Math.max(0,Math.min(state.i,frames().length-1));$('w').value=state.w;$('h').value=state.h;for(let k of ['x','y','scale','rot','duration'])$(k).value=cur()?.[k]??'';$('groups').replaceChildren(...state.g.map((g,i)=>{let b=document.createElement('button');b.textContent=g.name+' ('+g.f.length+')';b.className=i===state.gi?'active':'';b.onclick=()=>{state.gi=i;state.i=0;refresh()};return b}));$('frames').replaceChildren(...frames().map((f,i)=>{let b=document.createElement('button');b.className='tile '+(i===state.i?'active':'');let im=document.createElement('img');im.src=f.src;b.append(im,document.createTextNode(String(i+1)));b.onclick=()=>{state.i=i;refresh()};return b}));draw();persist()}
function addGroup(){let name=prompt('그룹 이름');if(name){snap();state.g.push({name,f:[]});state.gi=state.g.length-1;state.i=0;refresh()}}function load(file){return new Promise((res,rej)=>{let r=new FileReader;r.onerror=rej;r.onload=()=>{let i=new Image;i.onload=()=>res(i);i.onerror=rej;i.src=r.result};r.readAsDataURL(file)})}function add(im){let c=canvas(im.width,im.height);c.getContext('2d').drawImage(im,0,0);let s=Math.min(100,state.w/im.width*100,state.h/im.height*100);frames().push({src:c.toDataURL(),x:state.w/2,y:state.h-im.height*s/200,scale:s,rot:0,flip:false,duration:0})}
$('files').onchange=async e=>{snap();for(let f of e.target.files)add(await load(f));state.i=frames().length-1;e.target.value='';refresh()};$('sheet').onchange=async e=>{let im=await load(e.target.files[0]);let cols=+prompt('열 개수','4'),rows=+prompt('행 개수','1');if(cols>0&&rows>0&&cols*rows<=500){snap();for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){let w=Math.floor(im.width/cols),h=Math.floor(im.height/rows),c=canvas(w,h);c.getContext('2d').drawImage(im,x*w,y*h,w,h,0,0,w,h);add(c)}refresh()}e.target.value=''};
for(let k of ['x','y','scale','rot','duration'])$(k).onchange=()=>{if(cur()){snap();cur()[k]=+$(k).value;refresh()}};for(let k of ['w','h'])$(k).onchange=()=>{snap();state[k]=Math.max(1,Math.min(4096,+$(k).value||256));refresh()};for(let k of ['zoom','onion','ref','alpha','guide'])$(k).oninput=draw;
function flip(){if(cur()){snap();cur().flip=!cur().flip;refresh()}}function applyAll(){if(cur()){snap();let s=cur().scale;frames().forEach(f=>f.scale=s);refresh()}}function alignAll(){snap();frames().forEach(f=>{f.x=state.w/2;f.y=state.h-img(f.src).height*f.scale/200});refresh()}function move(d){let n=state.i+d;if(cur()&&n>=0&&n<frames().length){snap();[frames()[n],frames()[state.i]]=[cur(),frames()[n]];state.i=n;refresh()}}function duplicate(){if(cur()){snap();frames().splice(state.i+1,0,{...cur()});state.i++;refresh()}}function del(){if(cur()){snap();frames().splice(state.i,1);refresh()}}
function editPixels(fn){if(!cur())return;let im=img(cur().src),c=canvas(im.width,im.height),p=c.getContext('2d');p.drawImage(im,0,0);snap();cur().src=fn(c,p)||c.toDataURL();refresh()}function removeBg(){editPixels((c,p)=>{let d=p.getImageData(0,0,c.width,c.height),a=d.data,t=+$('tol').value,r=a[0],g=a[1],b=a[2];for(let i=0;i<a.length;i+=4)if(Math.max(Math.abs(a[i]-r),Math.abs(a[i+1]-g),Math.abs(a[i+2]-b))<=t)a[i+3]=0;p.putImageData(d,0,0)})}function trim(){editPixels((c,p)=>{let a=p.getImageData(0,0,c.width,c.height).data,l=c.width,r=-1,t=c.height,b=-1;for(let y=0;y<c.height;y++)for(let x=0;x<c.width;x++)if(a[(y*c.width+x)*4+3]){l=Math.min(l,x);r=Math.max(r,x);t=Math.min(t,y);b=Math.max(b,y)}if(r<0)return;let o=canvas(r-l+1,b-t+1);o.getContext('2d').drawImage(c,l,t,o.width,o.height,0,0,o.width,o.height);return o.toDataURL()})}
let drag=null;$('view').onpointerdown=e=>{if(!cur())return;snap();drag={x:e.clientX,y:e.clientY,fx:cur().x,fy:cur().y};$('view').setPointerCapture(e.pointerId)};$('view').onpointermove=e=>{if(!drag||!cur())return;let z=state.w/$('view').getBoundingClientRect().width;cur().x=Math.round(drag.fx+(e.clientX-drag.x)*z);cur().y=Math.round(drag.fy+(e.clientY-drag.y)*z);$('x').value=cur().x;$('y').value=cur().y;draw()};$('view').onpointerup=()=>{drag=null;persist()};document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)||!cur())return;let d={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key];if(d){e.preventDefault();snap();cur().x+=d[0]*(e.shiftKey?10:1);cur().y+=d[1]*(e.shiftKey?10:1);refresh()}});
function play(){if(timer){clearTimeout(timer);timer=null;refresh();return}if(!frames().length)return;function tick(){let n=frames().length,m=$('mode').value;if(m==='ping'){if(state.i+dir>=n||state.i+dir<0)dir=-dir;state.i=Math.max(0,state.i+dir)}else state.i=(state.i+(m==='reverse'?-1:1)+n)%n;draw();timer=setTimeout(tick,cur()?.duration||1000/(+$('fps').value||8))}timer=setTimeout(tick,cur()?.duration||125);draw()}
function download(data,name){let a=document.createElement('a');a.href=typeof data==='string'?data:URL.createObjectURL(data);a.download=name;a.click();if(typeof data!=='string')setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function render(f){let c=canvas(state.w,state.h);paint(c.getContext('2d'),f);return c}function exportPNG(){if(cur())download(render(cur()).toDataURL(),group().name+'_'+(state.i+1)+'.png')}function exportSheet(){if(!frames().length)return;let cols=+prompt('시트 열 개수',String(frames().length));if(!cols||cols<1)return;cols=Math.min(frames().length,Math.floor(cols));let c=canvas(state.w*cols,state.h*Math.ceil(frames().length/cols)),p=c.getContext('2d');frames().forEach((f,i)=>p.drawImage(render(f),i%cols*state.w,Math.floor(i/cols)*state.h));download(c.toDataURL(),group().name+'.png')}function saveProject(){download(new Blob([JSON.stringify(state)],{type:'application/json'}),'sprite-project.json')}$('project').onchange=async e=>{try{let s=JSON.parse(await e.target.files[0].text());if(!s.g?.length||!s.w||!s.h)throw Error();snap();state=s;refresh()}catch{alert('올바른 프로젝트 파일이 아닙니다.')}e.target.value=''};
async function exportZip(){if(!window.JSZip){alert('ZIP 라이브러리를 불러오지 못했습니다.');return}let z=new JSZip();for(let g of state.g)g.f.forEach((f,i)=>z.file(g.name+'/'+String(i+1).padStart(3,'0')+'.png',render(f).toDataURL().split(',')[1],{base64:true}));z.file('project.json',JSON.stringify(state));download(await z.generateAsync({type:'blob'}),'sprites.zip')}try{let s=localStorage.getItem('sprite-studio');if(s)state=JSON.parse(s)}catch{}refresh();
</script><script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script></html>
